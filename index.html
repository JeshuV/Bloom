<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bloom — habit garden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;1,9..144,300&family=Karla:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --paper:#FBF5F3; --card:#FFFDFC; --soft:#F6E9E7; --line:#EEDDDA;
  --ink:#4A2B33; --ink-soft:#957079; --accent:#C9808F; --accent-soft:#F0D3D6; --r:16px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Karla",system-ui,sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.wrap{max-width:560px;margin:0 auto;padding:22px 18px 80px}

.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.mark{font-family:"Fraunces",serif;font-size:19px;font-weight:600}
.mark span{color:var(--accent)}
.people{display:flex;align-items:center;gap:7px}
.who{width:36px;height:36px;border-radius:50%;border:2px solid transparent;background:var(--soft);
  font-size:17px;cursor:pointer;padding:0;transition:transform .2s,border-color .2s,background .2s}
.who:hover{transform:translateY(-2px)}
.who.on{border-color:var(--accent);background:var(--accent-soft)}
.who.plus{font-size:19px;color:var(--ink-soft);background:transparent;border:1px dashed var(--line)}
.who:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.hello{font-family:"Fraunces",serif;font-weight:300;font-style:italic;font-size:15px;color:var(--ink-soft);margin:0 0 16px}

.tabs{display:flex;gap:4px;background:var(--soft);border-radius:999px;padding:4px;margin-bottom:22px}
.tab{flex:1;border:0;background:transparent;cursor:pointer;font-family:"Karla",sans-serif;font-size:14px;
  font-weight:500;color:var(--ink-soft);padding:9px 0;border-radius:999px;transition:.18s}
.tab[aria-selected=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(120,80,90,.12)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--card);
  color:var(--ink-soft);cursor:pointer;font-size:15px}
.nav:hover{border-color:var(--accent);color:var(--accent)}
.nav:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bigdate{flex:1;text-align:center;font-family:"Fraunces",serif;font-weight:300;font-size:30px;line-height:1.1}
.bigdate em{display:block;font-size:14px;font-style:italic;color:var(--ink-soft);margin-top:4px}

.hero{display:flex;align-items:center;gap:20px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:20px;margin-top:16px}
.ring{position:relative;flex:0 0 auto;width:104px;height:104px}
.ring svg{transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .pct b{font-family:"Fraunces",serif;font-weight:400;font-size:25px;line-height:1}
.ring .pct small{font-size:11px;color:var(--ink-soft);margin-top:3px}
.heroCopy h3{font-family:"Fraunces",serif;font-weight:400;font-size:19px;margin:0 0 5px}
.heroCopy p{margin:0;font-size:13.5px;color:var(--ink-soft)}

.plants{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.plant{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:12px 13px;cursor:pointer;transition:border-color .2s,background .25s,transform .12s}
.plant:hover{border-color:var(--accent-soft)}
.plant:active{transform:scale(.99)}
.plant.done{background:linear-gradient(90deg,var(--accent-soft),var(--card) 72%);border-color:var(--accent-soft)}
.badge{flex:0 0 auto;width:42px;height:42px;border-radius:50%;background:var(--soft);display:grid;place-items:center;
  font-size:20px;transition:transform .35s cubic-bezier(.34,1.6,.64,1),background .25s}
.plant.done .badge{background:#fff;transform:scale(1.09) rotate(-7deg)}
.pname{flex:1;min-width:0}
.pname b{display:block;font-weight:500;font-size:15px}
.plant.done .pname b{color:var(--ink-soft)}
.pname small{font-size:12px;color:var(--accent)}
.tick{flex:0 0 auto;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--accent-soft);
  display:grid;place-items:center;color:transparent;font-size:13px;transition:.25s}
.plant.done .tick{background:var(--accent);border-color:var(--accent);color:#fff}
.mini{border:0;background:transparent;color:#D6BEBB;cursor:pointer;font-size:14px;padding:4px}
.mini:hover{color:var(--accent)}
.add{margin-top:11px;width:100%;padding:11px;border-radius:12px;border:1px dashed var(--line);
  background:transparent;color:var(--ink-soft);cursor:pointer;font-family:"Karla",sans-serif;font-size:14px}
.add:hover{border-color:var(--accent);color:var(--accent)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-top:16px}
.card h2{font-family:"Fraunces",serif;font-weight:400;font-size:17px;margin:0 0 13px}
.goal{display:flex;align-items:center;gap:11px;padding:8px 0;border-bottom:1px solid #F7EFED}
.goal:last-of-type{border-bottom:0}
.star{border:0;background:transparent;cursor:pointer;font-size:18px;padding:0;line-height:1;opacity:.4;transition:.2s}
.star.on{opacity:1;transform:scale(1.14)}
input.t{flex:1;min-width:0;border:0;background:transparent;font-family:"Karla",sans-serif;font-size:15px;
  color:var(--ink);padding:3px 5px;border-radius:7px}
input.t:focus{outline:0;background:var(--soft)}
input.t.done{color:var(--ink-soft);text-decoration:line-through;text-decoration-color:var(--accent-soft)}
.meter{height:5px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:14px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.mlabel{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-soft);margin-top:7px}
.hint{font-size:12.5px;color:var(--ink-soft);margin:9px 0 0}

.moods{display:flex;gap:7px}
.mood{flex:1;border:1px solid var(--line);background:transparent;border-radius:12px;padding:10px 2px;
  cursor:pointer;font-family:"Karla",sans-serif;font-size:11.5px;color:var(--ink-soft);transition:.2s}
.mood b{display:block;font-size:20px;font-weight:400;margin-bottom:3px}
.mood.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
textarea{width:100%;margin-top:12px;border:1px solid var(--line);border-radius:12px;background:#FDF9F8;
  padding:11px 12px;font-family:"Karla",sans-serif;font-size:14.5px;color:var(--ink);resize:vertical;min-height:60px}
textarea:focus{outline:0;border-color:var(--accent)}

.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.day{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 0;cursor:pointer;
  text-align:center;font-family:"Karla",sans-serif}
.day small{display:block;font-size:10.5px;color:var(--ink-soft)}
.day b{display:block;font-size:15px;font-weight:500;margin-top:1px}
.day em{display:block;font-size:12px;font-style:normal;margin-top:3px;height:15px}
.day.today{border-color:var(--accent)}
.day.sel{background:var(--accent-soft);border-color:var(--accent)}
.day:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
.gh{text-align:center;font-size:10.5px;color:var(--ink-soft)}
.cell{aspect-ratio:1;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;
  display:grid;place-items:center;font-size:12.5px;font-family:"Karla",sans-serif;color:var(--ink);padding:0}
.cell.blank{border:0;background:transparent;cursor:default}
.cell.today{border-color:var(--accent);font-weight:600}
.cell:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.veil{position:fixed;inset:0;background:rgba(74,43,51,.32);display:none;align-items:flex-end;justify-content:center;z-index:9}
.veil.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:22px 20px 26px;
  animation:up .28s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
.sheet h3{font-family:"Fraunces",serif;font-weight:400;font-size:19px;margin:0 0 14px}
.field{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 13px;
  font-family:"Karla",sans-serif;font-size:15px;color:var(--ink);background:#FDF9F8}
.field:focus{outline:0;border-color:var(--accent)}
.icons{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin:14px 0 4px}
.ic{aspect-ratio:1;border:1px solid var(--line);border-radius:11px;background:transparent;font-size:18px;cursor:pointer}
.ic.on{background:var(--accent-soft);border-color:var(--accent)}
.swatches{display:flex;gap:9px;margin:14px 0 4px}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.sw.on{border-color:var(--ink)}
.btns{display:flex;gap:9px;margin-top:18px}
.btn{flex:1;padding:12px;border-radius:12px;border:0;cursor:pointer;font-family:"Karla",sans-serif;
  font-size:14.5px;font-weight:500}
.btn.p{background:var(--accent);color:#fff}
.btn.s{background:var(--soft);color:var(--ink)}
.btn.d{background:transparent;color:var(--ink-soft);flex:0 0 auto;padding:12px 14px}

.petal{position:fixed;top:-30px;font-size:19px;pointer-events:none;z-index:20;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(108vh) rotate(420deg);opacity:0}}
.cheer{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:21;background:var(--card);
  border:1px solid var(--accent-soft);border-radius:20px;padding:22px 28px;text-align:center;max-width:80vw;
  box-shadow:0 14px 40px rgba(120,70,85,.18);animation:pop .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.85);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.cheer .big{font-size:34px}
.cheer b{display:block;font-family:"Fraunces",serif;font-weight:400;font-size:22px;margin:8px 0 4px}
.cheer p{margin:0;font-size:13.5px;color:var(--ink-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--ink);color:#fff;
  padding:9px 16px;border-radius:99px;font-size:13px;opacity:0;transition:.25s;z-index:30;pointer-events:none}
.toast.on{opacity:1}
.backup{text-align:center;font-size:12.5px;color:var(--ink-soft);margin:28px 0 0}
.backup button,.backup label{border:0;background:transparent;color:var(--accent);cursor:pointer;
  font-family:"Karla",sans-serif;font-size:12.5px;text-decoration:underline;padding:0}
.loading{text-align:center;color:var(--ink-soft);font-family:"Fraunces",serif;font-style:italic;padding:70px 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <div class="top">
    <div class="mark">bloom<span>.</span></div>
    <div class="people" id="people"></div>
  </div>
  <p class="hello" id="hello"></p>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-view="today" aria-selected="true">Today</button>
    <button class="tab" role="tab" data-view="week" aria-selected="false">This week</button>
    <button class="tab" role="tab" data-view="month" aria-selected="false">This month</button>
  </div>
  <div id="view"><div class="loading">waking the garden…</div></div>
  <p class="backup">
    Your garden lives in this browser.
    <button id="exp">Save a backup</button> ·
    <label for="imp">Restore one</label>
    <input type="file" id="imp" accept="application/json" hidden>
  </p>
</div>

<div class="veil" id="veil"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
const KEY='bloom-v2';
const ICONS=['🌸','🌿','💧','📖','🏃','🧘','☀️','🌙','✍️','🎧','🍎','💪','🛏️','🧴','🎨','📵','🫖','🚶','🧹','💐','🕯️','🥗','🎹','💌','🦋','⏰','🧺','📚'];
const ACCENTS=[['#C9808F','#F0D3D6'],['#A98CC0','#E6DCF0'],['#D79A6A','#F4E1D0'],['#7FA6A0','#DCEAE7']];
const MOODS=[['🥀','rough'],['🌫️','low'],['🌤️','okay'],['🌷','good'],['✨','lovely']];
const DOW=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
const STAGES=[[0,'🌱','sprouting'],[3,'🌿','growing'],[7,'🌷','budding'],[21,'🌸','blooming'],[60,'🌺','flourishing']];

let S=null, view='today', cursor=new Date(), timer=null;

const key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const mondayOf=d=>addDays(d,-((d.getDay()+6)%7));
const mKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ord=n=>n+(['th','st','nd','rd'][(n%100-20)%10]||['th','st','nd','rd'][n%100]||'th');

function load(){try{const v=localStorage.getItem(KEY);if(v)return JSON.parse(v)}catch(e){}return null}
function save(){clearTimeout(timer);timer=setTimeout(()=>{
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Not saved — storage is blocked in this browser.')}},250)}

/* Export / import so you can move your garden between devices */
function exportData(){
  const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b);
  a.download=`bloom-backup-${key(today())}.json`;
  a.click();URL.revokeObjectURL(a.href);
}
function importData(file){
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);
    if(!d.profiles?.length)throw 0;
    S=d;if(!S.data[S.active])S.active=S.profiles[0].id;
    save();render();toast('Garden restored.');
  }catch(e){toast('That file could not be read.')}};
  r.readAsText(file);
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'),2600)}

const me=()=>S.profiles.find(p=>p.id===S.active);
const D=()=>S.data[S.active];
const day=k=>(D().days[k]||={done:{},mood:null,note:''});
const wGoals=()=>(D().weekGoals[key(mondayOf(cursor))]||=[]);
const mGoals=()=>(D().monthGoals[mKey(cursor)]||=[]);
const goalsFor=s=>s==='w'?wGoals():mGoals();

function streak(id){let n=0,d=today();
  if(!D().days[key(d)]?.done?.[id])d=addDays(d,-1);
  while(D().days[key(d)]?.done?.[id]){n++;d=addDays(d,-1)}return n}
function stage(n){let s=STAGES[0];for(const x of STAGES)if(n>=x[0])s=x;return s}
function ratio(k){const h=D().habits.length;if(!h)return 0;
  return Object.values(D().days[k]?.done||{}).filter(Boolean).length/h}

function celebrate(perfect){
  for(let i=0;i<(perfect?34:22);i++){
    const p=document.createElement('div');p.className='petal';
    p.textContent=perfect?['🌸','✨','🌺','💮'][i%4]:['🌸','💮','🌿'][i%3];
    p.style.left=Math.random()*100+'vw';
    p.style.animationDuration=(2.4+Math.random()*2)+'s';
    p.style.animationDelay=(Math.random()*.7)+'s';
    document.body.appendChild(p);setTimeout(()=>p.remove(),5400);
  }
  const n=me().name.split(' ')[0];
  const m=perfect?['🌺',`A perfect day, ${n}.`,'Every habit kept. That is rare — sit with it.']
                 :['🌸',`Over 70%, ${n}!`,'The garden is thriving. Keep those streaks alive.'];
  const c=document.createElement('div');c.className='cheer';
  c.innerHTML=`<div class="big">${m[0]}</div><b>${esc(m[1])}</b><p>${m[2]}</p>`;
  document.body.appendChild(c);setTimeout(()=>c.remove(),3400);
}

function render(){
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',String(t.dataset.view===view)));
  const a=ACCENTS[me().accent%ACCENTS.length];
  document.documentElement.style.setProperty('--accent',a[0]);
  document.documentElement.style.setProperty('--accent-soft',a[1]);

  document.getElementById('people').innerHTML=
    S.profiles.map(p=>`<button class="who ${p.id===S.active?'on':''}" data-who="${p.id}" title="${esc(p.name)}">${p.emoji}</button>`).join('')
    +(S.profiles.length<3?`<button class="who plus" data-newwho aria-label="Add profile">+</button>`:'');

  const h=new Date().getHours(), greet=h<12?'good morning':h<17?'good afternoon':'good evening';
  const alive=D().habits.filter(x=>streak(x.id)>0).length;
  document.getElementById('hello').textContent=
    `${greet}, ${me().name.split(' ')[0]} — ${alive?`${alive} streak${alive>1?'s':''} still growing`:'a fresh patch of soil'}`;

  document.getElementById('view').innerHTML=view==='today'?vToday():view==='week'?vWeek():vMonth();
  wire();
}

function vToday(){
  const k=key(cursor),d=day(k),r=ratio(k),pct=Math.round(r*100),C=2*Math.PI*44;
  const isT=k===key(today());
  const line=pct===100?'Every habit kept.':pct>=70?'You are blooming today.':pct>=40?'Good roots. Keep going.'
    :pct>0?'A start is a start.':'Tap a plant to water it.';
  return `
  <div class="datebar">
    <button class="nav" data-shift="-1" aria-label="Previous day">‹</button>
    <div class="bigdate">${MON[cursor.getMonth()].slice(0,3)} ${ord(cursor.getDate())}<em>${isT?'today':cursor.toLocaleDateString(undefined,{weekday:'long'})}</em></div>
    <button class="nav" data-shift="1" aria-label="Next day">›</button>
  </div>

  <div class="hero">
    <div class="ring">
      <svg width="104" height="104" aria-hidden="true">
        <circle cx="52" cy="52" r="44" fill="none" stroke="var(--soft)" stroke-width="9"/>
        <circle cx="52" cy="52" r="44" fill="none" stroke="var(--accent)" stroke-width="9" stroke-linecap="round"
          stroke-dasharray="${C}" stroke-dashoffset="${C*(1-r)}" style="transition:stroke-dashoffset .55s cubic-bezier(.3,.9,.3,1)"/>
      </svg>
      <div class="pct"><b>${pct}%</b><small>${Object.values(d.done).filter(Boolean).length} of ${D().habits.length}</small></div>
    </div>
    <div class="heroCopy"><h3>Today's garden</h3><p>${line}</p></div>
  </div>

  <div class="plants">
    ${D().habits.map(x=>{const n=streak(x.id),st=stage(n);return `
      <div class="plant ${d.done[x.id]?'done':''}" data-toggle="${x.id}">
        <div class="badge">${x.icon}</div>
        <div class="pname"><b>${esc(x.name)}</b><small>${st[1]} ${n?`${n} day${n>1?'s':''} · ${st[2]}`:'plant it today'}</small></div>
        <button class="mini" data-edit="${x.id}" aria-label="Edit habit">✎</button>
        <div class="tick">✓</div>
      </div>`}).join('')||`<p class="hint">No plants yet — add your first habit below.</p>`}
  </div>
  <button class="add" data-newhabit>+ plant a new habit</button>

  <div class="card">
    <h2>How today felt</h2>
    <div class="moods">${MOODS.map((m,i)=>`<button class="mood ${d.mood===i?'on':''}" data-mood="${i}"><b>${m[0]}</b>${m[1]}</button>`).join('')}</div>
    <textarea data-note placeholder="One line about today…">${esc(d.note)}</textarea>
  </div>`;
}

function vWeek(){
  const mon=mondayOf(cursor),days=Array.from({length:7},(_,i)=>addDays(mon,i));
  const g=wGoals(),dn=g.filter(x=>x.done).length;
  return `
  <div class="datebar">
    <button class="nav" data-shift="-7" aria-label="Previous week">‹</button>
    <div class="bigdate">${MON[mon.getMonth()].slice(0,3)} ${mon.getDate()} – ${MON[days[6].getMonth()].slice(0,3)} ${days[6].getDate()}<em>week of</em></div>
    <button class="nav" data-shift="7" aria-label="Next week">›</button>
  </div>
  <div class="strip">${days.map(d=>{const k=key(d),r=ratio(k);
    return `<button class="day ${k===key(today())?'today':''} ${k===key(cursor)?'sel':''}" data-open="${k}">
      <small>${DOW[(d.getDay()+6)%7]}</small><b>${d.getDate()}</b>
      <em>${r>=1?'🌺':r>=.7?'🌸':r>=.3?'🌿':r>0?'🌱':''}</em></button>`}).join('')}</div>
  <p class="hint">Every day grows a plant as you keep habits. Tap one to open it.</p>

  <div class="card">
    <h2>Goals for this week</h2>
    ${goalRows(g,'w')}
    <button class="add" data-addgoal="w">+ add a weekly goal</button>
    <div class="meter"><i style="width:${g.length?dn/g.length*100:0}%"></i></div>
    <div class="mlabel"><span>${dn} of ${g.length} done</span><span>${g.length?Math.round(dn/g.length*100):0}%</span></div>
  </div>`;
}

function vMonth(){
  const first=new Date(cursor.getFullYear(),cursor.getMonth(),1);
  const off=(first.getDay()+6)%7,len=new Date(cursor.getFullYear(),cursor.getMonth()+1,0).getDate();
  const g=mGoals(),dn=g.filter(x=>x.done).length;
  let cells='';
  for(let i=0;i<off;i++)cells+=`<div class="cell blank"></div>`;
  for(let n=1;n<=len;n++){
    const d=new Date(cursor.getFullYear(),cursor.getMonth(),n),k=key(d),r=ratio(k);
    cells+=`<button class="cell ${k===key(today())?'today':''}" data-open="${k}" aria-label="${n}">${r>=1?'🌺':r>=.7?'🌸':r>=.3?'🌿':r>0?'🌱':n}</button>`;
  }
  return `
  <div class="datebar">
    <button class="nav" data-shift="-31" aria-label="Previous month">‹</button>
    <div class="bigdate">${MON[cursor.getMonth()]}<em>${cursor.getFullYear()}</em></div>
    <button class="nav" data-shift="31" aria-label="Next month">›</button>
  </div>
  <div class="card">
    <h2>Goals for ${MON[cursor.getMonth()]}</h2>
    ${goalRows(g,'m')}
    <button class="add" data-addgoal="m">+ add a monthly goal</button>
    <div class="meter"><i style="width:${g.length?dn/g.length*100:0}%"></i></div>
    <div class="mlabel"><span>${dn} of ${g.length} done</span><span>${g.length?Math.round(dn/g.length*100):0}%</span></div>
  </div>
  <div class="card">
    <h2>${MON[cursor.getMonth()]} in bloom</h2>
    <div class="grid">${DOW.map(d=>`<div class="gh">${d[0]}</div>`).join('')}${cells}</div>
    <p class="hint">🌱 started · 🌿 halfway · 🌸 a good day · 🌺 all of them</p>
  </div>`;
}

function goalRows(list,s){
  if(!list.length)return `<p class="hint">Nothing set yet. Add the first one below.</p>`;
  return list.map(g=>`<div class="goal">
    <button class="star ${g.done?'on':''}" data-goaldone="${s}:${g.id}" aria-label="Mark done">${g.done?'🌟':'☆'}</button>
    <input class="t ${g.done?'done':''}" value="${esc(g.text)}" data-goaltext="${s}:${g.id}">
    <button class="mini" data-delgoal="${s}:${g.id}" aria-label="Remove goal">×</button></div>`).join('');
}

const veil=document.getElementById('veil'),sheet=document.getElementById('sheet');
const closeSheet=()=>veil.classList.remove('on');
veil.onclick=e=>{if(e.target===veil)closeSheet()};

function habitSheet(id){
  const h=id?D().habits.find(x=>x.id===id):{name:'',icon:'🌸'};
  let icon=h.icon;
  sheet.innerHTML=`<h3>${id?'Edit habit':'Plant a habit'}</h3>
    <input class="field" id="hn" placeholder="What are you growing?" value="${esc(h.name)}">
    <div class="icons">${ICONS.map(i=>`<button class="ic ${i===icon?'on':''}" data-ic="${i}">${i}</button>`).join('')}</div>
    <div class="btns">${id?`<button class="btn d" id="del">Remove</button>`:''}
      <button class="btn s" id="x">Cancel</button><button class="btn p" id="ok">${id?'Save':'Plant it'}</button></div>`;
  veil.classList.add('on');
  sheet.querySelectorAll('[data-ic]').forEach(b=>b.onclick=()=>{icon=b.dataset.ic;
    sheet.querySelectorAll('.ic').forEach(x=>x.classList.toggle('on',x.dataset.ic===icon))});
  sheet.querySelector('#x').onclick=closeSheet;
  const dl=sheet.querySelector('#del');
  if(dl)dl.onclick=()=>{D().habits=D().habits.filter(x=>x.id!==id);save();closeSheet();render()};
  sheet.querySelector('#ok').onclick=()=>{
    const n=sheet.querySelector('#hn').value.trim()||'New habit';
    if(id){const t=D().habits.find(x=>x.id===id);t.name=n;t.icon=icon}
    else D().habits.push({id:uid(),name:n,icon});
    save();closeSheet();render()};
  setTimeout(()=>sheet.querySelector('#hn').focus(),60);
}

function profileSheet(id){
  const AV=['🌷','🌻','🦋','🐚','🍒','🌙','🫐','🕊️'];
  const p=id?S.profiles.find(x=>x.id===id):{name:'',emoji:'🌻',accent:S.profiles.length%ACCENTS.length};
  let em=p.emoji,ac=p.accent;
  sheet.innerHTML=`<h3>${id?'Edit profile':'New profile'}</h3>
    <input class="field" id="pn" placeholder="Name" value="${esc(p.name)}">
    <div class="icons" style="grid-template-columns:repeat(8,1fr)">${AV.map(a=>`<button class="ic ${a===em?'on':''}" data-av="${a}">${a}</button>`).join('')}</div>
    <div class="swatches">${ACCENTS.map((a,i)=>`<button class="sw ${i===ac?'on':''}" data-ac="${i}" style="background:${a[0]}" aria-label="Colour ${i+1}"></button>`).join('')}</div>
    <div class="btns">${id&&S.profiles.length>1?`<button class="btn d" id="del">Delete</button>`:''}
      <button class="btn s" id="x">Cancel</button><button class="btn p" id="ok">Save</button></div>`;
  veil.classList.add('on');
  sheet.querySelectorAll('[data-av]').forEach(b=>b.onclick=()=>{em=b.dataset.av;
    sheet.querySelectorAll('[data-av]').forEach(x=>x.classList.toggle('on',x.dataset.av===em))});
  sheet.querySelectorAll('[data-ac]').forEach(b=>b.onclick=()=>{ac=+b.dataset.ac;
    sheet.querySelectorAll('[data-ac]').forEach(x=>x.classList.toggle('on',+x.dataset.ac===ac))});
  sheet.querySelector('#x').onclick=closeSheet;
  const dl=sheet.querySelector('#del');
  if(dl)dl.onclick=()=>{S.profiles=S.profiles.filter(x=>x.id!==id);delete S.data[id];
    if(S.active===id)S.active=S.profiles[0].id;save();closeSheet();render()};
  sheet.querySelector('#ok').onclick=()=>{
    const n=sheet.querySelector('#pn').value.trim()||'Someone';
    if(id){const t=S.profiles.find(x=>x.id===id);t.name=n;t.emoji=em;t.accent=ac}
    else{const nid=uid();S.profiles.push({id:nid,name:n,emoji:em,accent:ac});S.data[nid]=blank();S.active=nid}
    save();closeSheet();render()};
  setTimeout(()=>sheet.querySelector('#pn').focus(),60);
}

function wire(){
  const v=document.getElementById('view');

  document.querySelectorAll('[data-who]').forEach(b=>b.onclick=()=>{
    if(b.dataset.who===S.active)return profileSheet(b.dataset.who);
    S.active=b.dataset.who;cursor=today();save();render()});
  const np=document.querySelector('[data-newwho]');
  if(np)np.onclick=()=>profileSheet(null);

  v.querySelectorAll('[data-shift]').forEach(b=>b.onclick=()=>{
    const n=+b.dataset.shift;
    cursor=Math.abs(n)===31?new Date(cursor.getFullYear(),cursor.getMonth()+(n>0?1:-1),1):addDays(cursor,n);
    render()});

  v.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{
    const [y,m,d]=b.dataset.open.split('-').map(Number);
    cursor=new Date(y,m-1,d);view='today';render()});

  v.querySelectorAll('[data-toggle]').forEach(el=>el.onclick=e=>{
    if(e.target.closest('[data-edit]'))return;
    const k=key(cursor),d=day(k),before=Math.round(ratio(k)*100);
    d.done[el.dataset.toggle]=!d.done[el.dataset.toggle];save();
    const after=Math.round(ratio(k)*100);
    render();
    if(after===100&&before<100)celebrate(true);
    else if(after>=70&&before<70)celebrate(false);
  });

  v.querySelectorAll('[data-edit]').forEach(b=>b.onclick=e=>{e.stopPropagation();habitSheet(b.dataset.edit)});
  const nh=v.querySelector('[data-newhabit]');
  if(nh)nh.onclick=()=>habitSheet(null);

  v.querySelectorAll('[data-mood]').forEach(b=>b.onclick=()=>{
    const d=day(key(cursor)),i=+b.dataset.mood;d.mood=d.mood===i?null:i;save();render()});
  const nt=v.querySelector('[data-note]');
  if(nt)nt.oninput=()=>{day(key(cursor)).note=nt.value;save()};

  v.querySelectorAll('[data-addgoal]').forEach(b=>b.onclick=()=>{
    goalsFor(b.dataset.addgoal).push({id:uid(),text:'New goal',done:false});save();render()});
  v.querySelectorAll('[data-goaldone]').forEach(b=>b.onclick=()=>{
    const [s,id]=b.dataset.goaldone.split(':');const g=goalsFor(s).find(x=>x.id===id);
    g.done=!g.done;save();render()});
  v.querySelectorAll('[data-goaltext]').forEach(i=>i.onchange=()=>{
    const [s,id]=i.dataset.goaltext.split(':');const g=goalsFor(s).find(x=>x.id===id);
    g.text=i.value.trim()||g.text;save()});
  v.querySelectorAll('[data-delgoal]').forEach(b=>b.onclick=()=>{
    const [s,id]=b.dataset.delgoal.split(':');const l=goalsFor(s);
    l.splice(l.findIndex(x=>x.id===id),1);save();render()});
}

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{view=t.dataset.view;render()});

  {id:uid(),name:'Morning walk',icon:'🚶'},
  {id:uid(),name:'Read 20 pages',icon:'📖'},
  {id:uid(),name:'Drink 3L water',icon:'💧'},
  {id:uid(),name:'No phone after 11',icon:'📵'}],days:{},weekGoals:{},monthGoals:{}}}

S=load();
if(!S||!S.profiles?.length){const id=uid();

if(!S.data[S.active])S.data[S.active]=blank();
cursor=today();

document.getElementById('imp').onchange=e=>{if(e.target.files[0])importData(e.target.files[0])};
